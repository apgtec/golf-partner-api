# Every ball position revision of a round, in revision order, resuming after $afterRevision (0 replays
# the round). Queue semantics: resumable and at-least-once. Persist the highest revision you processed.
subscription SubscribeToBallPositionEvents(
  $tournament: String!
  $round: String!
  $afterRevision: bigint!
  $batchSize: Int!
) {
  ballPositionEvents(
    batch_size: $batchSize
    cursor: {initial_value: {revision: $afterRevision}, ordering: ASC}
    where: {round: {providerId: {_eq: $round}, tournament: {providerId: {_eq: $tournament}}}}
  ) {
    revision
    strokeId
    strokeProviderId
    strokeNum
    strokeKind
    hole
    holeOrder
    player {
      providerId
    }
    group {
      providerId
    }
    lat
    lon
    elevation
    surface
    subSurface
    state
    inTheHole
    retracted
    hatArgb
    shirtArgb
    pantsArgb
    observedAt
    recordedAt
  }
}
