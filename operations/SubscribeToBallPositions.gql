# The current best position of every stroke of a round. State semantics: the current set on connect,
# then the whole set again on every change. Add `hole: {_eq: 7}` to the where to follow one hole.
subscription SubscribeToBallPositions($tournament: String!, $round: String!) {
  ballPositions(
    where: {round: {providerId: {_eq: $round}, tournament: {providerId: {_eq: $tournament}}}}
    order_by: {strokeId: asc}
  ) {
    revision
    strokeId
    strokeProviderId
    strokeNum
    strokeKind
    hole
    holeOrder
    player {
      providerId
    }
    lat
    lon
    elevation
    surface
    subSurface
    state
    inTheHole
    retracted
    observedAt
  }
}
