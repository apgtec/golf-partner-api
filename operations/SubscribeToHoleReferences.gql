# Pin and tee positions of a round. Pins move daily: subscribe rather than cache.
subscription SubscribeToHoleReferences($tournament: String!, $round: String!) {
  holeReferences(
    where: {round: {providerId: {_eq: $round}, tournament: {providerId: {_eq: $tournament}}}}
    order_by: [{hole: asc}, {type: asc}]
  ) {
    hole
    type
    lat
    lon
    elevation
    updatedAt
  }
}
