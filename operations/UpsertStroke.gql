# A stroke report: a player's stroke at one moment (READY, OVER_THE_BALL or HIT, at `at`). Send one per
# stroke at HIT, or one per status change; a report only changes the fields it carries, and resending the
# same report is a no-op.
mutation UpsertStroke($input: StrokeInput!) {
  upsertStroke(input: $input) {
    accepted
    message
  }
}
